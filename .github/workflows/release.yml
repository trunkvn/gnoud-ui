name: Release

# Changesets: a push to main either opens/updates a "Version Packages" pull request (when there
# are pending changesets) or, when that pull request is merged, publishes to npm.
#
# One-time setup, in this repository's Settings > Secrets and variables > Actions:
#   NPM_TOKEN  a granular npm access token with "Read and write" on the @gnoud-ui scope
# and Settings > Actions > General > Workflow permissions:
#   tick "Allow GitHub Actions to create and approve pull requests".

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the Version Packages pull request
  id-token: write # npm provenance

jobs:
  release:
    # Never publish from a fork.
    if: github.repository == 'trunkvn/gnoud-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signs the package so npm shows where and how it was built.
          NPM_CONFIG_PROVENANCE: "true"
