name: Release

# Changesets: a push to main either opens/updates a "Version Packages" pull request (when there
# are pending changesets) or, when that pull request is merged, publishes to npm, tags the release
# and creates a GitHub release. Uses changesets/action v2, which matches Changesets CLI v3
# (v1 reads the CLI's stdout, whose format changed in v3, and so never noticed a publish).
#
# One-time setup, in this repository's Settings > Secrets and variables > Actions:
#   NPM_TOKEN  a granular npm access token with "Read and write" on the @gnoud-ui scope
# and Settings > Actions > General > Workflow permissions:
#   tick "Allow GitHub Actions to create and approve pull requests".

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the Version Packages pull request
  id-token: write # npm provenance

jobs:
  release:
    # Never publish from a fork.
    if: github.repository == 'trunkvn/gnoud-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # npm auth comes from setup-node's registry-url, which reads NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signs the package so npm shows where and how it was built.
          NPM_CONFIG_PROVENANCE: "true"
